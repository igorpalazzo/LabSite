services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media
      - ./src/data/blog:/workspace/content
      - ./public/news:/workspace/news
    environment:
      CONTENT_DIR: /workspace/content
      STATIC_MEDIA_DIR: /workspace/news

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_CMS_LOCAL: "true"
    ports:
      - "5173:80"
    depends_on:
      - api
